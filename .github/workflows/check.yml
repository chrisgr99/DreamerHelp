# Runs on every pull request, before anything is merged.
#
# The point is that a contributor hears about a mechanical failure within a minute, from the
# machine, rather than from a maintainer days later — and that the boring failures never reach a
# reviewer at all. What is left to judge is whether the claims are true.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # DOES IT PARSE, AND DOES IT MEAN WHAT IT SAYS: the schema of every help file and research
      # file, a citation for every fact, and the style rules on every line.
      - name: validate the database
        run: python3 tools/validate.py

      # IS WHAT EACH JACK EXPECTS CURRENT. It is derived from data/research into data/help, and a
      # fact changed without re-deriving would ship yesterday's phrase quietly.
      - name: every help file's expects matches its research
        run: python3 tools/build.py --check
