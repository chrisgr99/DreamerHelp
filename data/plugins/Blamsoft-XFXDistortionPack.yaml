          'poly': false
        '1':
          'poly': false
    'notes': 'Blamsoft publish no source. The module declares 10 parameters, 5 inputs, 2 outputs and no lights. Three of the ten parameters are two-position switches rather than knobs, which the panel does not make obvious: Tone and Extra Bass are configured with an EnableParamQuantity printing Off and On, Tone defaulting on and Extra Bass defaulting off. Model is 0 to 3 with a ModelParamQuantity printing A, B, C and D. Bass, Mid and Treble are each 0 to 1 with a display multiplier of 22 and an offset of -11, so they read -11 to +11 and centre at 0. Distortion and Level read 0 to 11, Mix 0 to 100%. Only Distortion, Mix and Level have CV jacks. Changing Enable, Tone, Extra Bass or Model rebuilds the simulation and crossfades from the old one, so all four are stepped rather than smoothly swept. The DSP runs its circuit at 192000Hz whatever the patch rate, and loads its triode lookup tables from the plugin''s own res folder at start; table files for 48000, 96000 and 384000 are named too but the plugin does not ship them, but the 192000 path is the one the module selects, so nothing is missing at runtime. The maker''s PDF manual was read with pypdf and agrees throughout; it is the source of the account of what the tone stack, Extra Bass and Model do, including the statement that the stack is not flat with the controls centred. The widget adds no context menu of its own.'
