          'poly': false
    'notes': 'Blamsoft publish no source. configParam gives Enable 0 to 1 default 1 with an EnableParamQuantity printing Off and On, Tone 0 to 1 default 0.5 shown as 0 to 11, Distortion 0 to 1 default 0.5 shown as 0 to 11, Mix 0 to 1 default 1 shown as 0 to 100%, Level 0 to 1 default 0.75 shown as 0 to 11. Each CV jack is added to its knob at 0.1 per volt and the sum clamped to the knob''s own 0 to 1 range, so a CV cannot push a control past its ends. The panel art draws a line from each jack to the knob it feeds and every one is right. Enable does not use Rack''s bypass: it selects between two modes of the generated DSP, the active circuit and a delay line that matches the active path''s latency, and the module runs both in parallel for a short crossfade whenever the switch changes. The maker''s PDF manual was read on this pass with pypdf; it agrees throughout and is the source of the account of what the Tone filter does. The widget adds no context menu of its own. 2.0.2 is the only published build of this plugin, so no commit had to be settled.'
  'Blamsoft-XFXOverdrive':
    'lines':
      - 'Stereo overdrive modelled on a green guitar pedal, mixing a soft-clipped copy of the input back in under a lowpass tone control'
      - 'Runs the signal through the overdrive when on; with it off the module is bypassed, and the switch crossfades between the two rather than stepping'
      - 'Sweeps the lowpass filter on the output from a low corner up to a high one that lifts the top end; the readout runs 0 to 11'
      - 'Sets the gain into the diode clipper that is mixed back with the input, so turning it up distorts more; the clipping is soft rather than hard'
      - 'Sets how much of the overdriven signal is in the output against the dry input, 0 to 100% wet'
      - 'Sets the output gain'
      - 'Adds to the TONE knob, where 10V covers the whole of that knob''s travel'
      - 'Adds to the DRIVE knob, where 10V covers the whole of that knob''s travel'
      - 'Adds to the MIX knob, where 10V covers the whole of that knob''s travel'
      - 'Adds to the LEVEL knob, where 10V covers the whole of that knob''s travel'
      - 'The left audio input into the overdrive'
      - 'The right audio input into the overdrive'
      - 'The left output, carrying the dry signal and the overdrive in the proportion set by MIX'
      - 'The right output, carrying the dry signal and the overdrive in the proportion set by MIX'
      - 'Note — the two channels are separate circuits and neither input is normalled to the other, so with nothing patched into IN II the OUT II jack stays at 0V'
      - 'Note — the circuit is modelled around a signal of ±1, and the module divides each input by 5 and multiplies each output by 5 to suit it, so ±5V is the level it expects'
