    'notes': 'There is no published source and no manual: pluginUrl, manualUrl and sourceUrl are all empty in the installed plugin.json, and the plugin folder holds only the plugin and res. Everything here comes from the census positions and the panel art res/3mountainsVCVCompatible2.svg. Index order is not panel order anywhere on this module: the first oscillator holds parameters 0 to 4, inputs 0 to 2 and outputs 0 to 3, and the other two are interleaved pairs after them, so for example the four output jacks of the leftmost oscillator run 1, 3, 2, 0 from left to right. tripleOSC::step calls printf("sine pulsewidth with CV %f\n", ...) unconditionally once per oscillator per sample, inside the audio loop. The Pulse knob computes its width as (0.5 - knob) * about 2.04 + 1 and then clamps to 0 and 1, so the whole bottom half of its travel gives the same fully open pulse, and the configured default of 0 sits inside that dead half. The Mod and Pwm knobs are both configured with a default of 0, which makes the left and right jacks of every oscillator inert on a freshly placed module. The frequency is 130.8Hz raised by the pitch in octaves and then multiplied by one plus two to the power of the Fine knob over twelve, which doubles it: Fine at zero therefore gives 261.6Hz, and the knob''s range of -1 to +1 works out at about fifty cents either way. The res folder also holds 3mountains.svg, an older panel whose lettering reads CV, fine, pwm and pulsewidth where the shipped one reads Mod, Fine, Pwm and Pulse; the module loads the shipped one.'
