    'notes': 'No source is published. The four CV inputs multiply their knobs rather than adding to them, the same pattern as Damonitu: a factor of one is substituted when the jack is empty, so a cable resting at 0V pulls the parameter to its clamp floor. The module returns early from process while the clock input is empty, so it does nothing at all with no clock patched. The bass output really is an octave below the chord: the note minus twelve is stored as element zero of the chord vector, and the chord output''s channel loop begins at element one, so the bass note is not repeated there. The README lists the voicings as default, rootless, open and three notes; the maker''s own wording is DEFAULT, OPEN, ROOTLESS and THREE NOTES, and the order of the last two could not be settled, so the line names them without claiming an order. The bass inversion parameter is configured 1 to 3 rather than 0 to 2, and the display names its three settings ROOT, 1ST INV and 2ND INV.'
  'Masino':
    'lines':
      - 'Arpeggiator: it plays the notes held at its polyphonic pitch input in an order and a rhythm chosen by two knobs'
      - 'Chooses the rhythm: UNF spreads the hits evenly, EUC spreads them as a Euclidean pattern, PRM puts them on prime-numbered pulses, WBE on the weak beats, SBE on the strong beats and RND at random'
      - 'Chooses the order the held notes are played in: UPP upwards, DWN downwards, TCE from the ends towards the centre, FCE from the centre towards the ends and RND at random'
      - 'Sets how many octaves the arpeggio climbs through, one to three'
      - 'Sets how many of the pulses carry a note, as a percentage; it changes nothing under the PRM rhythm'
      - 'Sets the length of the gate output as a percentage of the gap between clock pulses'
      - 'Each rising edge above 1V is one pulse of the arpeggio'
      - 'Sets the density knob directly from 0 to 5V, in steps, and moves the knob with it; the knob cannot be turned while a cable is in'
      - 'Sets the gate length knob directly from 0 to 5V, in steps, and moves the knob with it; the knob cannot be turned while a cable is in'
      - 'Sets the octaves knob directly from 0 to 5V, in steps, and moves the knob with it; the knob cannot be turned while a cable is in'
      - 'The notes to arpeggiate, one per channel, at 1V per octave'
      - 'A rising edge above 2V returns the arpeggio to its first pulse'
      - 'Sets the rhythm knob directly from 0 to 5V, in steps, and moves the knob with it; the knob cannot be turned while a cable is in'
      - 'Sets the melody knob directly from 0 to 5V, in steps, and moves the knob with it; the knob cannot be turned while a cable is in'
      - '10V for the share of the clock interval the gate length knob sets'
      - 'The note being played, one at a time, at 1V per octave'
      - 'A 1ms pulse at 10V on each note'
      - 'Note — nothing is played until a clock is patched to clck and at least one note is held at the 1v/o input; the arpeggio is built from the channels present on that input'
      - 'Note — the pitch input and the clock should come through chains of the same length, or the two arrive a sample or more apart and the arpeggio picks up the wrong notes'
      - 'Menu — Pulses per quarter: 2 PPQN, 3 PPQN, 4 PPQN, 5 PPQN, 6 PPQN — sets how many pulses of the incoming clock make one beat'
      - 'Menu — Pulses per quarter factor: X1, X2, X3 — multiplies the pulses-per-quarter setting'
