    'notes': 'No source is published; the maker''s README is at github.com/phestrada/OME. Two faults are worth knowing. First, a second ParamWidget for the Tempo CV trimmer is built at the very end of the widget''s constructor and given the position of the end-of-cycle output jack, so the panel carries two widgets for parameter 4 and the eoc jack has a knob drawn on top of it; the library screenshot shows the knob there. The help click still resolves to the jack, because the port''s box is the smaller of the two, but a mouse drag reaches the knob first. Second, every one of the eight CV inputs MULTIPLIES its knob by the incoming voltage rather than adding to it, so a patched cable sitting at 0V drives the parameter to its clamp floor. The root and octave CVs carry one further special case: when their knob is at zero the jack sets the value on its own. Two parameter tooltips are stale — parameter 11 is the pattern trimmer but is named Division CV, and parameter 19 is the steps trimmer but is named Size CV. Inputs 7 and 9 were never passed to configInput, so they hover with no name; they are the octave and chord CV inputs. Parameters 1, 2 and 3 were never passed to configParam either, so the clock, run and reset buttons hover with no name, but Module::config gives them a working 0-to-1 quantity, so they do work. The README calls the control under the clock jack a light; the code reads it as a manual step button. The internal clock is an exponential of the tempo parameter, 60 BPM at the default, and it is used only when nothing is patched to the clock input.'
  'Tezca':
    'lines':
      - 'Generates a chord progression by walking Bartók''s axis system, with a polyphonic chord, a bass note, the notes of the current mode, a gate and a trigger'
      - 'Starts and stops the progression; the module comes up running'
      - 'Returns the progression to the tonic and builds a fresh chord'
      - 'Sets the length of the gate output as a share of the gap between clock pulses, never shorter than 1ms'
      - 'Sets how many clock pulses pass before the progression moves to another chord, two to thirty-six'
      - 'Sets how many notes the chord holds, three to seven, which has an effect only under the DEFAULT voicing'
      - 'Chooses the voicing: DEFAULT, OPEN, ROOTLESS or THREE NOTES'
      - 'Chooses which note of the chord is taken as the bass: ROOT, 1ST INV or 2ND INV'
      - 'Scales the voltage at the steps CV input before it multiplies the steps knob'
      - 'Scales the voltage at the chord CV input before it multiplies the chord knob'
      - 'Scales the voltage at the voicing CV input before it multiplies the voicing knob'
      - 'Scales the voltage at the bass CV input before it multiplies the bass knob'
      - 'From the tonic, the chance of moving to the dominant; the rest of the chance goes to the subdominant'
      - 'From the subdominant, the chance of moving to the tonic; the rest of the chance goes to the dominant'
      - 'From the dominant, the chance of moving to the tonic; the rest of the chance goes to the subdominant'
      - 'A rising edge above 2V starts the progression, and the next one stops it'
      - 'A rising edge above 2V returns the progression to the tonic and builds a fresh chord'
      - 'Each rising edge above 2V is one pulse of the progression; nothing moves until a clock is patched here'
      - 'Sets the tonic the axis system is built on, read as a pitch; with nothing patched here the tonic is C4'
      - 'Multiplies the steps knob by this voltage, scaled by the trimmer beside it; the result is held between two and thirty-six'
      - 'Multiplies the chord knob by this voltage, scaled by the trimmer beside it; the result is held between three and seven notes'
      - 'Multiplies the voicing knob by this voltage, scaled by the trimmer beside it, so a cable resting at 0V holds the DEFAULT voicing'
      - 'Multiplies the bass knob by this voltage, scaled by the trimmer beside it'
      - 'The chord, one note per channel, with the bass note left out'
      - 'The lowest note of the chord, on its own, an octave below the chord output'
      - 'Every note of the current mode, one per channel'
      - '10V for the share of the clock interval the gate length knob sets, restarted on each clock pulse'
      - 'A 1ms pulse at 10V on each clock pulse'
      - 'Note — nothing happens until a clock is patched to the clock input; the module returns early on every sample while that jack is empty'
      - 'Note — the three circles across the middle of the panel light to show which of the tonic, subdominant and dominant axes the progression is on'
      - 'Menu — Mode transition: Gentle, Rude — Gentle moves between modes in order of brightness, from Lydian down to Locrian, and Rude moves at random'
