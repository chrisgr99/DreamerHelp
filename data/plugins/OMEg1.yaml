    'notes': 'No source is published. Maŝino''s five CV inputs do not modulate their knobs, they overwrite them: each one clamps the incoming voltage to 0 to 5V, quantises it with rmlab::RythMeloLab::quantize and stores the result straight into the Param, so the knob visibly moves to the voltage and cannot be turned while the cable is in. The clock input''s rising threshold is 1V while the reset input''s is 2V, so a weak clock will run the module when an equally weak reset will not. The pitch input is genuinely polyphonic, with a loop bounded by its channel count; every other jack reads channel one alone. The panel prints rythm, which is the maker''s spelling.'
