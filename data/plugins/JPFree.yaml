    'notes': 'No source is published; read from the maker''s manual. The Mode parameter is parameter 13 and has no widget position in the census, so it gets no line and no tag; it is set from the menu, whose three names are Absolute, Relative and Relative + Intervals. The panel artwork changes with the mode (res/OctavatorA.svg, OctavatorB.svg, OctavatorC.svg). Rand draws its seed from rack::system::getUnixTime; Reset re-runs the stored pair of seed words, which is what makes the pattern repeatable.'
