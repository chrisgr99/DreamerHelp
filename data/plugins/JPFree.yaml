    'notes': 'No source is published; read from the maker''s manual. Inputs A and B and outputs A and B get no family: the module copies whatever is patched into them. THE PASS-THROUGH SWITCHES ARE REVERSED in this build. A gate byte is what output 1, named Gate Open, is set to 10V from. Output 3 (Output A) is written from input 2 only when that byte is zero, and output 4 (Output B) only when it is non-zero. The maker''s port descriptions read ''Passes Input A when Gate is Open'' and ''Passes Input A when Gate is Low'' (the second is also a typo for Input B), and the manual says the same. The panel groups Gate Open with the A row and Gate Low with the B row, so a person reading the panel will get it wrong too. The Mode switch prints an infinity sign for repeat and a 1 for one shot; a value of 1 is repeat.'
  'Octavator':
    'lines':
      - 'Replaces or shifts the octave of a V/Oct signal at random, with a fader per octave setting how often each one is chosen and a seed that makes the pattern repeatable'
      - 'Sets how often this octave is chosen; at zero it is never used, and the faders are weighed against each other rather than adding up to anything'
      - 'Adds up to a hundred cents of random detuning to each note'
      - 'Returns the internal seed to its stored value, so the same pattern of octaves plays again'
      - 'Draws a new internal seed from the clock, giving a fresh pattern of octaves'
      - 'The pitch to be re-octaved; each polyphonic channel is treated on its own'
      - 'Marks where one note ends and the next begins, so a new octave can be drawn; each polyphonic channel is treated on its own'
      - 'Returns the internal seed to its stored value when the voltage rises past 2V'
      - 'Draws a new internal seed when the voltage rises past 2V'
      - 'The re-octaved pitch, with as many channels as the wider of the two inputs'
      - 'The gate input passed through, with as many channels as the wider of the two inputs'
      - 'Note — with nothing patched into the gate input the octave is redrawn whenever the incoming pitch changes'
      - 'Note — the fader row is read differently in each mode, so the number under a fader means an absolute octave, a shift in octaves, or an interval, depending on what the menu is set to'
      - 'Note — in Absolute the ten faders are the octaves 0 to 9, and the one chosen replaces the octave of the incoming note'
      - 'Note — in Relative the ten faders are shifts of minus five to plus five octaves, added to the octave of the incoming note'
      - 'Note — in Relative + Intervals the top row of faders is shifts of minus two to plus three octaves and the bottom row is intervals set below the note'
      - 'Menu — Mode: Absolute, Relative, Relative + Intervals — chooses how the row of faders is read, and swaps the panel artwork to match'
