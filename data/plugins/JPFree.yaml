  'ShiftAndShuffle':
    'lines':
      - 'An expander that shifts and shuffles the sequence of the JP sequencer it is placed against, under button or trigger control; it goes immediately to the right of that sequencer'
      - 'Chooses whether a shift moves every note block or only the blocks inside the current sequence length'
      - 'Moves the note blocks of the sequence one position to the left'
      - 'Moves the note blocks of the sequence one position to the right'
      - 'Moves every note in the sequence to the next note in the current note pool'
      - 'Moves every note in the sequence down to the next note in the current note pool'
      - 'Gives each column of note blocks a chance of swapping places with another column'
      - 'Gives each column of note blocks a chance of having its rows shuffled'
      - 'Sets the chance that a column is swapped or shuffled, from none to every column'
      - 'Moves the note blocks one position to the left when triggered; how far each volt moves them is set on the menu'
      - 'Moves the note blocks one position to the right when triggered; how far each volt moves them is set on the menu'
      - 'Moves every note down to the next note in the note pool when triggered; how far each volt moves them is set on the menu'
      - 'Moves every note to the next note in the note pool when triggered; how far each volt moves them is set on the menu'
      - 'Shuffles the columns of note blocks when the voltage rises past 2V, with the chance set by the strength knob'
      - 'Shuffles the rows within each column when the voltage rises past 2V, with the chance set by the strength knob'
      - 'Note — this module does nothing on its own: place it directly to the right of a Three Track, Star Matrix Jr, Improv Jr or Evo Seq, with no module in between'
      - 'Note — patching a sequencer''s end-of-cycle output into one of these inputs applies that change once a cycle'
      - 'Note — a shift mode marked Uni reads a negative voltage as zero, and one marked Bi steps in the opposite direction on it'
      - 'Menu — Shift Left Mode: Always 1 (at 2V+), 1 / Volt Uni, 1 / Volt Bi, 1 / 2 Volts Uni, 1 / 2 Volts Bi, 12 / Volt Uni, 12 / Volt Bi — sets how far one volt on the left shift input moves the sequence'
      - 'Menu — Shift Right Mode: Always 1 (at 2V+), 1 / Volt Uni, 1 / Volt Bi, 1 / 2 Volts Uni, 1 / 2 Volts Bi, 12 / Volt Uni, 12 / Volt Bi — sets how far one volt on the right shift input moves the sequence'
      - 'Menu — Shift Up Mode: Always 1 (at 2V+), 1 / Volt Uni, 1 / Volt Bi, 1 / 2 Volts Uni, 1 / 2 Volts Bi, 12 / Volt Uni, 12 / Volt Bi — sets how far one volt on the up input moves the notes'
      - 'Menu — Shift Down Mode: Always 1 (at 2V+), 1 / Volt Uni, 1 / Volt Bi, 1 / 2 Volts Uni, 1 / 2 Volts Bi, 12 / Volt Uni, 12 / Volt Bi — sets how far one volt on the down input moves the notes'
