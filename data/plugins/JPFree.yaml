    'notes': 'The plugin publishes no source; everything here was read from the manual at version 2.1 revision 2. The clock thresholds are 2.0V high and 0.1V low, and the phase-mode rule is above 9V then below 1V. The Lock parameter of each block and the menu-only Swing and Gate Length parameters have no census position, so they are left untagged. The manual''s figure of 16 note blocks does not match this build, which configures 12 (params 0 to 119, ten per block).'
  'StarMatrixJr':
    'lines':
      - 'A five-block sequencer where the next block is chosen by a grid of transition chances rather than by counting in order'
      - 'One beat of the sequence, holding up to four notes in one of nine subdivisions; left click to step forward, shift and left click to step back, right click to choose from a list'
      - 'Sets the pitch of one note in the block: click for a keyboard carrying Rest, Tie and an Auto Advance button, or drag up and down to set the voltage'
      - 'Sets the chance of moving from one note block to another: click to switch that move on or off, drag up and down to set its probability, and hover over it to show which move it is'
      - 'Advances the sequence one note block'
      - 'Returns the sequence to its first note block when the voltage rises past 2V'
      - 'High while a note is playing, for the length set on the menu'
      - 'The pitch of the note now playing'
      - 'A gate at the end of each cycle'
      - 'Note — nothing happens until a clock is patched; the module has no clock of its own'
      - 'Note — a block with no outgoing transition switched on has nowhere to go, so set at least one chance in each block''s row before playing'
      - 'Note — this build has five note blocks and a five by five transition grid; the maker''s manual says eight blocks'
      - 'Note — the five squares on the diagonal of the grid would be a block moving to itself; they carry no button and cannot be clicked'
      - 'Menu — Transition Mode: Chance, Cycle — Chance picks one switched-on move at random, each weight being its probability; Cycle takes them in a fixed order, the weights setting how often each comes up'
      - 'Menu — Arrow Display Mode: On, Only Hover, Off — chooses when the arrow overlays are drawn: from the current block unless the cursor is over a transition, only under the cursor, or never'
      - 'Menu — Gate Length — sets how much of each note the gate output stays high for'
      - 'Menu — Swing — delays every second note block'
      - 'Menu — Clock Mode: Gate, Phase — reads the clock input either as a square wave, high above 2V and low below 0.1V, or as a ramp that advances a block when it falls from above 9V to below 1V'
      - 'Menu — Randomize — randomises the pitches, the rhythm or the transition grid'
      - 'Menu — Shift & Shuffle — shifts and shuffles the sequence from the menu, the way the Shift & Shuffle expander does from its jacks'
      - 'Menu — Set Rhythm — sets every note block to one subdivision'
      - 'Menu — Note Pool — sets the pool of notes the randomisers draw from, from a scale, from a keyboard, or by shifting the current pool in semitones'
      - 'Menu — Copy/Paste — copies and pastes the sequence or the note pool in a portable format that other JP sequencers read'
      - 'Menu — Expanders — places an expander module beside this one'
