  'EvoSeq':
    'lines':
      - 'An eight-block sequencer with seven ways to evolve what it is playing, each on a button and a trigger input'
      - 'One beat of the sequence, holding up to four notes in one of nine subdivisions; left click to step forward, shift and left click to step back, right click to choose from a list'
      - 'Sets the pitch of one note in the block: click for a keyboard carrying Rest, Tie and an Auto Advance button, or drag up and down to set the voltage'
      - 'Sets how many note blocks are played before the sequence returns to the first'
      - 'Switches the sequence between playing forward and playing in reverse'
      - 'Switches the inversion on and off, turning the distance between each note played upside down'
      - 'Shifts the blocks of the sequence one position forward or backward'
      - 'Gives the next block to be played a fresh set of random pitches'
      - 'Copies the rhythm of another block onto the next block to be played'
      - 'Adds a note to the next block to be played, or takes one away'
      - 'Gives the next block to be played a fresh random rhythm'
      - 'Takes every evolution back off, returning the sequence to what was programmed'
      - 'Advances the sequence one note block'
      - 'Returns the sequence to its first note block when the voltage rises past 2V'
      - 'Switches the sequence between forward and reverse when the voltage rises past 2V'
      - 'Switches the inversion on and off when the voltage rises past 2V'
      - 'Shifts the blocks one position when the voltage rises past 2V'
      - 'Gives the next block fresh random pitches when the voltage rises past 2V'
      - 'Copies another block''s rhythm onto the next block when the voltage rises past 2V'
      - 'Adds or removes a note in the next block when the voltage rises past 2V'
      - 'Gives the next block a fresh random rhythm when the voltage rises past 2V'
      - 'Takes every evolution back off when the voltage rises past 2V'
      - 'High while a note is playing, for the length set on the menu'
      - 'The pitch of the note now playing'
      - 'A gate at the end of each cycle'
      - 'Note — nothing happens until a clock is patched; the module has no clock of its own'
      - 'Note — the evolutions are an overlay on the programmed sequence, so the Clear button puts everything back rather than undoing one step at a time'
      - 'Menu — Permitted Rhythm Evolutions — chooses which subdivisions the borrow, mutate and random evolutions are allowed to use'
      - 'Menu — Fill Remaining Sequence — fills every note block outside the current length at random, using the blocks that are inside it'
      - 'Menu — Invert Mode: Semitones, Quantize, Steps — measures the inverted interval in semitones, in semitones then quantised to the note pool, or in steps through the note pool'
      - 'Menu — Gate Length — sets how much of each note the gate output stays high for'
      - 'Menu — Swing — delays every second note block'
      - 'Menu — Clock Mode: Gate, Phase — reads the clock input either as a square wave, high above 2V and low below 0.1V, or as a ramp that advances a block when it falls from above 9V to below 1V'
      - 'Menu — Randomize — randomises the pitches or the rhythm of the whole sequence'
      - 'Menu — Shift & Shuffle — shifts and shuffles the sequence from the menu, the way the Shift & Shuffle expander does from its jacks'
      - 'Menu — Set Rhythm — sets every note block to one subdivision'
      - 'Menu — Note Pool — sets the pool of notes the randomisers draw from, from a scale, from a keyboard, or by shifting the current pool in semitones'
      - 'Menu — Copy/Paste — copies and pastes the sequence or the note pool in a portable format that other JP sequencers read'
      - 'Menu — Expanders — places an expander module beside this one'
