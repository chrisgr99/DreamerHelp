'plugin': 'PatchAndTweak'
'source': 'no published source; read from the installed 2.0.1 build and its res/ artwork'
'read': '2026-09-14'
'verification': 'voltage ranges are not published for this plugin: no public source is available for verification. Corrections and citations are welcome from anyone with access to the source.'
'modules':
  'Blank':
    'lines':
      - 'A narrow blank panel carrying the Patch & Tweak name, with a hidden jack that spins its ampersand'
      - 'Turns the red ampersand of the Patch & Tweak logo, a full turn for every 10V and the other way for negative voltage; the turn is held to a little over three revolutions a second'
      - 'Note — the jack is drawn invisibly, so there is nothing on the panel to aim at, but a cable dropped on the spot takes hold and a patched cable shows against the artwork'
      - 'Note — the panel passes no audio and puts nothing out; the only thing it does is turn the ampersand in time with whatever you patch'
    'in':
      '0': 1
    'family':
      'in':
        '0': 'cv'
    'props':
      'in':
        '0':
          'poly': false
          'negative': 'swings'
          'step': 'continuous'
    'notes': 'The maker never called configInput for this jack, so Rack''s hover tooltip for it is blank and the census records it with no name. It is a real PortWidget added with addInput and it accepts a cable; the InvisiblePort constructor loads PJ301M.svg and then hides the drawn parts, leaving a jack that works and cannot be seen. A full turn at 10V follows from 0.2 times pi radians per volt; the three-revolutions figure is the 20.0 radians-per-second slew limit divided by two pi, and neither derived number is stated by the maker. The ampersand between PATCH and TWEAK is not part of the panel artwork: it is a separate rotating widget, which is why the panel SVG renders with a gap where it belongs.'
