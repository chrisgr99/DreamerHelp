    'notes': 'No source is published; nothing here was taken from the maker''s manual page. PARAMETER 1 IS NOT A RESET. Its configured name is RESET, the same name given to parameter 7, but process uses it only to choose between two output scalings: at zero the eight outputs are the raw value times 5, so plus and minus 5V, and at one they are the value times 5 plus 5, so 0V to 10V. Its widget sits at census position 116.9,170.4, between the two waveform knobs, where the panel art draws a sine resting on a line and a sine crossing a line. It comes up at zero, the bipolar setting. The actual reset is parameter 7, a momentary button configured 0 to 10 and tested against 5, in parallel with the reset input. INDEX ORDER IS NOT PANEL ORDER FOR THE OUTPUTS. Each quad of jacks is laid out as a square and numbered clockwise: index 0 top left, 1 top right, 2 bottom right, 3 bottom left, and the same for 4 to 7. The panel prints 0 degrees, 1X, 2X and 3X beside them, which is the phase multiple each carries, and the tags follow the positions rather than the numbering. Parameter ranges from the constructor: FREQ 0.0001 to 10 with a default of 5; FREQ DIVIDER 0 to 6 with a default of 0, offset by -3 in process to give -3 to +3; WAVEFORM 1 and 2 each 1 to 4 with a default of 1; PHASE 1 and 2 each 0 to 90 degrees with a default of 90, so a new module is already in quadrature. Sixteen lights are configured, two per output, driven as a red and green pair from the sign of that output. The menu carries one item, High Quality, saved in the patch under the key HQ; with it off the DSP runs once every sixteen samples and process interpolates between the last two results.'
