'plugin': 'AISynthesis'
'source': 'no published source; read from the installed 2.0.1 build'
'read': '2026-09-14'
'verification': 'voltage ranges are not published for this plugin: no public source is available for verification. Corrections and citations are welcome from anyone with access to the source.'
'modules':
  'AI001_Multiple':
    'lines':
      - 'A multiple: one voltage copied to three jacks, twice over, with the second group fed from the first until its own source jack is used'
      - 'The voltage copied to Ports 2, 3 and 4, and to Ports 6, 7 and 8 as well while Port 5 is empty'
      - 'A copy of whatever is patched to Port 1, at the same number of channels, and one channel of 0V while Port 1 is empty'
      - 'The voltage copied to Ports 6, 7 and 8; putting a cable in here cuts that group off from Port 1'
      - 'A copy of Port 5, or of Port 1 while Port 5 is empty, at the same number of channels, and one channel of 0V while both are empty'
      - 'Note — the small triangle drawn between the fourth and fifth jacks marks the break: Port 1 feeds both groups until something is patched to Port 5.'
      - 'Note — both groups pass polyphony straight through, so a sixteen-channel cable into Port 1 comes out of all six copies with sixteen channels.'
      - 'Note — the jacks carry no printed names; hovering one shows the maker''s own numbering, Port 1 through Port 8, counted downwards.'
    'in':
      '0': 1
      '1': 3
    'out':
      '0': 2
      '1': 2
      '2': 2
      '3': 4
      '4': 4
      '5': 4
    'props':
      'in':
        '0':
          'poly': true
          'step': 'continuous'
          'negative': 'swings'
          'normal': '0V'
        '1':
          'poly': true
          'step': 'continuous'
          'negative': 'swings'
          'normal': 'Port 1'
      'out':
        '0':
          'poly': true
        '1':
          'poly': true
        '2':
          'poly': true
        '3':
          'poly': true
        '4':
          'poly': true
        '5':
          'poly': true
    'notes': 'No source is published for this plugin. The jacks carry no family: a multiple passes on whatever is patched into it, so no colour is the honest answer. The port names in the lines are the maker''s own configInput and configOutput strings, which are "Port 1 (source)", "Port 5 (source / break)" and "Port 2" through "Port 8"; nothing is lettered on the panel itself. The only context-menu item is "Panel skin", offering "Black" and "Silver" and saved to the patch as panelSkin; it changes which of res/AI001-black-v6.svg and res/AI001-silver-v6.svg is drawn and nothing else, so it is left out of the lines. An unpatched source leaves its three outputs at one channel of 0V rather than disconnected: process() writes the channel count 1 and a zero voltage. No numeric constants are quoted in any line, so check_numbers.py has nothing to test here.'
