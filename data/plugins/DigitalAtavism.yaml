'plugin': 'DigitalAtavism'
'source': 'no published source; read from the installed 2.0.0 build'
'read': '2026-09-14'
'verification': 'voltage ranges are not published for this plugin: no public source is available for verification. Corrections and citations are welcome from anyone with access to the source.'
'modules':
  'Blip':
    'lines':
      - 'An 8-bit blip voice: one oscillator crossfading between a pulse wave and a falling sawtooth, shaped by a hold-and-release envelope'
      - 'Note — With nothing patched into TRIG the envelope is held wide open and the oscillator drones. It only shapes the sound once a trigger cable is in.'
      - 'Note — The pitch, the hold time and the release time are read once, at the moment TRIG fires; moving those controls during a note has no effect until the next one.'
      - 'Sets the pitch, from 54 semitones below C4 at 261.63Hz to 54 semitones above it'
      - 'Crossfades the oscillator from a pulse wave at its minimum to a falling sawtooth at its maximum'
      - 'Sets the width of the pulse wave, from 1% to 99%; with BLND fully over to the sawtooth the pulse is out of the mix and this does nothing'
      - 'Sets how long the envelope holds at full level before the release begins, from 1ms to 250ms'
      - 'Sets how long the envelope takes to fall in a straight line from full level to nothing, from 0ms to 250ms'
      - 'Adds to the pitch set by FREQ at one volt per octave, read at the moment the trigger arrives'
      - 'Adds to the crossfade set by BLND, a tenth of its travel per volt'
      - 'Adds to the width set by PW, a tenth of its travel per volt'
      - 'Doubles the time set by HOLD per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Doubles the time set by REL per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Starts a note when it rises past 2V, and has to fall back below 0.1V before another note can start'
      - 'The envelope as a voltage from 0V to 10V, quantised to 127 steps'
      - 'The voice, quantised to 127 steps and clipped at 5V either way'
    'param':
