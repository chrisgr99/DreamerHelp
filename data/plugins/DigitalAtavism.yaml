      'in':
        '0':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
        '1':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
        '2':
          'poly': false
          'step': 'continuous'
          'negative': 'subtracts'
        '3':
          'poly': false
          'step': 'continuous'
          'negative': 'subtracts'
        '4':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
        '5':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
        '6':
          'poly': false
          'step': 'stepped'
          'negative': 'ignored'
      'out':
        '0':
          'poly': false
          'step': 'stepped'
        '1':
          'poly': false
          'step': 'stepped'
    'notes': 'No source is published. THE LOW-PASS FILTER IS SHUT BY DEFAULT. The module configures parameter 7, the knob the panel prints LPF, from 0 to 1 with a default of 0. It is turned into a filter coefficient of 0.1 times the cube of 0.9 times the knob plus 0.1, so a knob at 0 gives 0.0001 and a knob at 1 gives 0.1. The filter is applied on every sub-sample with no bypass, so at the default the corner is far below the audio band and the module is effectively silent until LPF is raised. The HPF knob, parameter 6, is squared and scaled by 0.1 and is genuinely out of the path at 0. Index order is not panel order for these two: parameter 7 (LPF) sits above parameter 6 (HPF) on the panel, at census positions 90,270 and 90,300, and they are tagged accordingly. Neither filter has a CV jack. The noise source is a fresh rand() value taken thirty-two times per oscillator cycle, so it is pitched rather than white. The pitch bend multiplies the oscillator period once per sample by one plus a hundredth of the cube of the setting, and the period is held between 8 and 400000 samples. Panel lettering came from https://library.vcvrack.com/screenshots/400/DigitalAtavism/Hit.png; the plugin ships no panel SVG.'
  'UT-P':
    'lines':
      - 'A voltage-controlled switch that picks one channel out of a polyphonic cable and passes it on'
      - 'Note — The choice is made among the channels of the cable in IN, so a mono cable gives the selector only one position and nothing to switch between.'
      - 'Note — A UT-OX placed immediately to the right takes a second, separately chosen channel from the same polyphonic input, and further UT-OX modules can be chained on from there.'
      - 'Note — With a polyphonic cable in CV, each of its channels makes its own choice and the result appears on the output channel of the same number.'
      - 'The polyphonic signal to choose from; the number of channels on the cable is the number of positions the selector has'
      - 'Chooses which channel of IN is passed, with the voltage range set on the menu spread evenly over the channels and the nearest one taken'
      - '10V on the polyphonic channel currently chosen, and 0V on every other channel'
      - 'A 1ms pulse at 10V on a channel, at the moment that channel becomes the chosen one'
      - 'The chosen channel of IN, carried on the output channel of the same number with the rest at 0V'
      - 'Menu — Voltage Range: 0V - 10V, 0V - 5V, 0V - 1V, -10V - 10V, -5V - 5V, -2.5V - 2.5V, -1V - 1V — sets the span of CV that is spread across the channels; a new module starts at 0V - 10V'
    'in':
      '0': 5
      '1': 4
    'out':
      '0': 6
      '1': 7
      '2': 8
    'family':
      'in':
        '0': 'cv'
      'out':
        '0': 'trigger'
        '1': 'trigger'
    'props':
      'in':
        '0':
          'poly': true
          'step': 'stepped'
        '1':
          'poly': true
      'out':
        '0':
          'poly': true
          'step': 'stepped'
        '1':
          'poly': true
          'step': 'stepped'
        '2':
          'poly': true
    'notes': 'No source is published. The selector maths runs as follows: the CV is rescaled from the chosen voltage range onto 0 to 1, multiplied by the number of channels less one, has 0.5 added and is truncated, then clamped, so each channel occupies an equal slice of the range and the boundaries fall half way between. The voltage range is a module setting, not a per-jack one, and it is saved with the patch under the key voltageRange; the seven names are spelled exactly as listed, from DigitalAtavism::VoltageRange::GetName, and the limits come from the tables beside it: 0 to 10, 0 to 5, 0 to 1, -10 to 10, -5 to 5, -2.5 to 2.5 and -1 to 1. A new module comes up on the first of them, set by the constructor. The menu item itself is labelled Voltage Range: followed by the current choice, and opens a submenu. Two lights are declared in the call to config() and neither is given a LightWidget or ever written, so nothing on the panel shows them. IN and CV behave differently from each other: a polyphonic CV drives a per-channel switch, while a mono CV places the chosen value on the output channel matching the chosen position rather than on channel 1. No family is given to IN or OUT because they carry whatever is sent through them. Panel lettering came from https://library.vcvrack.com/screenshots/400/DigitalAtavism/UT-P.png; the plugin ships no panel SVG.'
  'UT-OX':
    'lines':
      - 'An expander for UT-P, placed immediately to the right of it, taking its own separately chosen channel from the same polyphonic input'
      - 'Note — It reads the polyphonic signal from the module on its left, which has to be a UT-P or another UT-OX in a chain running back to one. On its own the output stays at 0V.'
      - 'Chooses which channel of the polyphonic signal in the UT-P is passed, with the voltage range set on the menu spread evenly over the channels and the nearest one taken'
      - 'A 1ms pulse at 10V at the moment the chosen channel changes'
      - 'The chosen channel of the polyphonic signal arriving from the left, as one mono voltage'
      - 'Menu — Voltage Range: 0V - 10V, 0V - 5V, 0V - 1V, -10V - 10V, -5V - 5V, -2.5V - 2.5V, -1V - 1V — sets the span of CV that is spread across the channels; a new module starts at 0V - 10V'
    'in':
      '0': 2
    'out':
      '0': 3
      '1': 4
    'family':
      'in':
        '0': 'cv'
      'out':
        '0': 'trigger'
    'props':
      'in':
        '0':
          'poly': false
          'step': 'stepped'
      'out':
        '0':
          'poly': false
          'step': 'stepped'
        '1':
          'poly': false
    'notes': 'No source is published. UT_OX checks that the left neighbour''s model is UT-P or UT-OX before reading its expander message, so a chain of them all work from the one polyphonic input; it then passes the same message on to the right, but only when the module there is a UT-OX. WITH NO VALID NEIGHBOUR IT DOES NOT FALL SILENT IN THE OBVIOUS WAY. The fallback builds a message of sixteen zero values, so the selector still moves across sixteen positions and the trigger output still fires as the CV is swept, while the signal output stays at 0V. Unlike UT-P this module is mono throughout: the CV jack is read at channel one only and both outputs are single-channel. The voltage range menu is the same one UT-P carries, from the shared UT_Base::BaseWidget, saved under the key voltageRange and starting at 0V - 10V. The panel has no IN jack and no GATE output. Panel lettering came from https://library.vcvrack.com/screenshots/400/DigitalAtavism/UT-OX.png; the plugin ships no panel SVG.'
