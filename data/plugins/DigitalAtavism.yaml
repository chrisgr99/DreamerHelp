    'notes': 'No source is published. There is no manual, no README and no res/ documentation. Panel lettering came from the VCV library screenshot at https://library.vcvrack.com/screenshots/400/DigitalAtavism/Blip.png because the plugin ships no panel SVG at all — the panels are drawn at runtime by Blip::Widget::draw. Parameter 3 is configured by the count passed to config() but never given a configParam or a ParamWidget, so it has no name, no tooltip and no position, and cannot be clicked; outputs 0 and 1 are the same, leftovers of the shared layout with Coin. The oscillator runs at eight times the engine rate and the eight sub-samples are averaged. The trigger threshold is Rack''s usual rescale of 0.1 to 2.0 volts. The envelope has two timed stages, hold then release; the hold stage adds a punch term, which on this module is stored as zero, so the hold is flat.'
  'Coin':
    'lines':
      - 'An 8-bit coin-pickup voice: a square wave that jumps to a second pitch part-way through the note, shaped by a hold-and-release envelope'
      - 'Note — With nothing patched into the TRIG input the envelope is held wide open and the square wave drones. It only shapes the sound once a trigger cable is in.'
      - 'Note — The starting pitch, the jump time, the hold, the release and the punch are read once, at the moment the trigger fires; the pitch jump itself is read when the jump happens.'
      - 'Sets the starting pitch, from 54 semitones below C4 at 261.63Hz to 54 semitones above it'
      - 'Sets how far the pitch jumps when the note reaches the time set by TIME, from 24 semitones down to 24 semitones up'
      - 'Sets how long after the trigger the pitch jumps, from 0ms to 400ms'
      - 'Adds a burst of extra level at the start of the note which fades away across the hold stage; the knob starts at 100%, above the 60% maximum it is configured with'
      - 'Sets how long the envelope holds at full level before the release begins, from 1ms to 250ms'
      - 'Sets how long the envelope takes to fall in a straight line from full level to nothing, from 0ms to 250ms'
      - 'Adds to the starting pitch set by FREQ at one volt per octave, read at the moment the trigger arrives'
      - 'Adds to the pitch jump set by FMOD at one volt per octave, read at the moment the jump happens'
      - 'Doubles the time set by TIME per volt and halves it per volt below zero, up to a ceiling of 800ms, read at the moment the trigger arrives'
      - 'Doubles the time set by HOLD per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Doubles the time set by REL per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Starts a note when it rises past 2V, and has to fall back below 0.1V before another note can start'
      - 'A 1ms pulse at 10V at the moment the pitch jumps'
      - 'The envelope as a voltage from 0V to 10V, quantised to 127 steps'
      - 'The voice, quantised to 127 steps and clipped at 5V either way'
    'param':
