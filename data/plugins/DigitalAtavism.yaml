          'poly': false
          'step': 'stepped'
    'notes': 'No source is published. THE PUNCH KNOB''S DEFAULT IS OUTSIDE ITS OWN RANGE. Coin configures parameter 3 with a minimum of 0.3, a maximum of 0.6 and a default of 1.0; Rack does not clamp a default, so the knob comes up at 100% while its tooltip range reads 30% to 60%, and Initialise puts it back there. The punch term is used as an extra envelope level of one plus twice the remaining hold fraction times the punch, so at the default it starts the note three times over full scale and the output clips for the first part of the hold. Output 0 is configured by the count passed to config() but has no configOutput and no PortWidget, so it cannot be clicked or patched; it is a leftover of the layout shared with Blip and Hit. The oscillator is a plain 50% square wave with no pulse-width or waveform control, oversampled eight times. The panel prints TRIG twice, on the pitch-change output near the top and on the note input at the bottom. Panel lettering came from https://library.vcvrack.com/screenshots/400/DigitalAtavism/Coin.png; the plugin ships no panel SVG.'
  'DTrig':
    'lines':
      - 'Takes a trigger in and puts one out again after a delay, as a gate of its own length'
      - 'Note — Retriggering during a delay can only lengthen it: a new delay is written in only when it is longer than the time left to run, and the gate length works the same.'
      - 'Sets how long after the incoming trigger the output fires, from 1.5ms to 2 seconds'
      - 'Sets how long the output gate stays high, from 1ms to 1000ms; the panel prints TIME while the maker''s tooltip calls it Gate time'
      - 'Doubles the delay set by the DLAY knob per volt and halves it per volt below zero, up to a ceiling of 5 seconds'
      - 'Doubles the gate length set by the TIME knob per volt and halves it per volt below zero, held between 1ms and 5 seconds'
      - 'Starts the delay when it rises past 2V, and has to fall back below 0.1V before it will start another'
      - 'Goes to 10V when the delay runs out and stays there for the gate length, then returns to 0V'
    'param':
      '0': 2
      '1': 3
    'in':
      '0': 4
      '1': 6
      '2': 5
    'out':
      '0': 7
    'family':
      'in':
        '0': 'cv'
        '1': 'trigger'
        '2': 'cv'
      'out':
        '0': 'trigger'
    'props':
      'in':
        '0':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
        '1':
          'poly': false
          'step': 'stepped'
          'negative': 'ignored'
        '2':
          'poly': false
          'step': 'continuous'
          'negative': 'swings'
      'out':
        '0':
          'poly': false
          'step': 'stepped'
    'notes': 'No source is published. The knob figures are delay 0.0015 to 2 seconds with a default of 0.15, gate 0.001 to 1 second with a default of 0.001, both shown in ms by a display multiplier of 1000. So the gate knob comes up at its own minimum, a 1ms pulse. Each of the two CV jacks is a multiplier on its knob through exp2f, so a patched cable resting at 0V leaves the knob alone; the delay result is capped at 5 seconds and the gate at 5 seconds with a 1ms floor, both above what the knobs alone can reach. The write-back is a maximum rather than an assignment, which is why a retrigger cannot shorten a delay already in progress. The panel prints DLAY and TIME beside the jack-and-knob pairs and TRIG twice, once on the input and once on the output; the maker''s tooltips for the second pair are Gate time on the knob and Gate length on the jack. Panel lettering came from https://library.vcvrack.com/screenshots/400/DigitalAtavism/DTrig.png; the plugin ships no panel SVG.'
  'Hit':
    'lines':
      - 'An 8-bit hit voice: one oscillator crossfading between a pulse wave, a falling sawtooth and pitched noise, with a pitch bend and a pair of filters'
      - 'Note — LPF comes up at 0%, which closes the low-pass filter almost completely and leaves next to nothing at the output. Turn it up before expecting to hear anything.'
      - 'Note — With nothing patched into TRIG the envelope is held wide open and the oscillator drones. It only shapes the sound once a trigger cable is in.'
      - 'Note — The pitch, the bend, the hold, the release and both filter settings are read once, at the moment TRIG fires; moving those controls during a note has no effect until the next one.'
      - 'Sets the pitch, from 54 semitones below C4 at 261.63Hz to 54 semitones above it'
      - 'Bends the pitch across the note, upwards as it is turned up and downwards as it is turned down; the amount follows the cube of the setting, so small settings do very little'
      - 'Crossfades the oscillator from a pulse wave at its minimum, through a falling sawtooth and then pitched noise, and back to the pulse wave at its maximum'
      - 'Sets the width of the pulse wave, from 1% to 99%'
      - 'Sets how long the envelope holds at full level before the release begins, from 1ms to 250ms'
      - 'Sets how long the envelope takes to fall in a straight line from full level to nothing, from 0ms to 250ms'
      - 'Opens the low-pass filter at the output; at 0% the filter is almost shut and very little gets through, and at 100% it is at its widest'
      - 'Sets the corner of the high-pass filter at the output; at 0% the filter is out of the signal path altogether'
      - 'Adds to the pitch set by FREQ at one volt per octave, read at the moment the trigger arrives'
      - 'Adds to the bend set by SLIDE, a tenth of its travel per volt, read at the moment the trigger arrives'
      - 'Adds to the crossfade set by BLND, three tenths of its travel per volt'
      - 'Adds to the width set by PW, a tenth of its travel per volt'
      - 'Doubles the time set by HOLD per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Doubles the time set by REL per volt and halves it per volt below zero, read at the moment the trigger arrives'
      - 'Starts a note when it rises past 2V, and has to fall back below 0.1V before another note can start'
      - 'The envelope as a voltage from 0V to 10V, quantised to 127 steps'
      - 'The voice, quantised to 127 steps and clipped at 5V either way'
