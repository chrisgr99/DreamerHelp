<svg xmlns="http://www.w3.org/2000/svg" width="15.24mm" height="128.5mm" viewBox="0 0 15.24 128.5">
  <!-- BACKGROUND AND RULES ONLY. Rack renders panels with nanosvg, which does not draw <text>
       at all, so every word on this panel is drawn at runtime in HelpWidget::draw. A panel that
       letters itself in SVG has to carry the text converted to paths; this one does not. -->
  <rect width="15.24" height="128.5" fill="#1b1f26"/>
  <rect x="0.4" y="0.4" width="14.44" height="127.7" fill="none" stroke="#2c3440" stroke-width="0.3"/>
  <line x1="2.2" y1="19.5" x2="13.04" y2="19.5" stroke="#2c3440" stroke-width="0.3"/>
  <line x1="2.2" y1="112" x2="13.04" y2="112" stroke="#2c3440" stroke-width="0.3"/>
</svg>
