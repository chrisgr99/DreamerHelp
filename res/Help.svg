<svg xmlns="http://www.w3.org/2000/svg" width="20.32mm" height="128.5mm" viewBox="0 0 20.32 128.5">
  <!-- BACKGROUND ONLY. Rack renders panels with nanosvg, which does not draw <text> at all, so
       every word on this panel is drawn at runtime in HelpWidget::draw — and so is the green
       border, which has to match the one the sibling plugin strokes in code. -->
  <rect width="20.32" height="128.5" fill="#161a20"/>
</svg>
